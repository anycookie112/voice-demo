[project]
name = "python-voice-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.12.0",
    "diffusers>=0.36.0",
    "fastapi>=0.123.5",
    "faster-whisper>=1.2.1",
    "flash-attn",
    "kokoro>=0.9.4",
    "jieba",
    "ordered-set",
    "langchain",
    "langchain-anthropic>=1.2.0",
    "langchain-core>=1.1.0",
    "langchain-groq>=1.1.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.4",
    "matplotlib>=3.10.8",
    "numpy>=2.0,<2.4",
    "pandas>=2.3.3",
    "pip",
    "python-dotenv",
    "rich>=14.2.0",
    "spacy>=3.8.11",
    "transformers==4.51.3",
    "uvicorn>=0.38.0",
    "websockets",
    # 🔥 PyTorch CUDA
    "torch",
    "torchvision",
    "pypinyin>=0.55.0",
    "cn2an>=0.5.23",
]

# 🔥 CUDA 13.0 PyTorch index
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# 🔥 Bind torch packages to that index
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

# 🔥 FlashAttention prebuilt wheel
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.6.4/flash_attn-2.8.3+cu130torch2.9-cp311-cp311-linux_aarch64.whl" }

[project.optional-dependencies]
assemblyai = ["assemblyai"]
elevenlabs = ["elevenlabs"]
anthropic = ["langchain-anthropic"]

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
